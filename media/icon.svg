  </defs>

  <rect x="8" y="8" width="112" height="112" rx="18" fill="#11191B" />

  <g clip-path="url(#tile-clip)">
    <rect x="8" y="8" width="112" height="112" fill="#11191B" />

    <g fill="none" stroke="#243235" stroke-width="1.2">
      <path d="M23 8v112" />
      <path d="M52 8v112" />
      <path d="M82 8v112" />
      <path d="M112 8v112" />
      <path d="M8 28h112" />
      <path d="M8 57h112" />
      <path d="M8 87h112" />
    </g>

    <g fill="none" stroke="#2A383D" stroke-linecap="round" opacity=".95">
      <path d="M-5 36c20-9 34-8 52 0 22 10 42 10 86-5" stroke-width="2" />
      <path d="M-6 76c21-13 42-13 63 0 26 16 51 11 82-9" stroke-width="2" />
      <path d="M-4 104c24-8 43-5 62 8 21 14 42 15 73 1" stroke-width="1.7" />
    </g>

    <path d="M37 42 64 28 93 48 83 87 49 100 28 72Z" fill="#004245" stroke="#4AC9D0" stroke-width="5.6" stroke-linejoin="round" />
    <path d="M37 42 57 67 83 87" fill="none" stroke="#E0EAED" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M64 28 57 67 49 100" fill="none" stroke="#93A1A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".82" />

    <g stroke="#11191B" stroke-width="3.4">
      <circle cx="37" cy="42" r="5.8" fill="#E0EAED" />
      <circle cx="64" cy="28" r="5.8" fill="#E0EAED" />
      <circle cx="93" cy="48" r="5.8" fill="#E0EAED" />
      <circle cx="49" cy="100" r="5.8" fill="#E0EAED" />
      <circle cx="28" cy="72" r="5.8" fill="#E0EAED" />
      <circle cx="83" cy="87" r="7" fill="#F2B74A" />
    </g>

    <circle cx="57" cy="67" r="4.2" fill="#4AC9D0" stroke="#11191B" stroke-width="3" />
  </g>

  <rect x="8" y="8" width="112" height="112" rx="18" fill="none" stroke="#415055" stroke-width="2" />
